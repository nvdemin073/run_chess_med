<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <nav class="navbar">

    <section class="fullscreen-section">
        <div class="content">
            <h1>Добавить молитву</h1>
            
            <div class="add-prayer-page">
                <div class="prayer-form">
                    <textarea placeholder="Напишите вашу молитву..." id="prayerText"></textarea>
                    <select id="prayerCategory">
                        <option value="утренняя">Утренняя</option>
                        <option value="вечерняя">Вечерняя</option>
                        <option value="благодарность">Благодарность</option>
                        <option value="просьба">Просьба</option>
                    </select>
                    <button onclick="addPrayer()">Сохранить молитву</button>
                    <a href="prayer-diary.html" class="back-link">Посмотреть дневник →</a>
                </div>
            </div>
        </div>
    </section>

    <script src="prayer-diary.js"></script>
